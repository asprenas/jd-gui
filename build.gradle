buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.10.0'
    }
}

plugins {
    id 'java'
    id 'distribution'
    id 'edu.sc.seis.launch4j' version '4.0.0'
    id 'com.netflix.nebula.ospackage' version '12.3.0'    // RPM & DEB support
}

// Common configuration //
// '-PjdGuiVersion' / '-PjdCoreVersion' override the defaults (release workflow passes the latest tags)
rootProject.version=findProperty('jdGuiVersion') ?: '1.6.6'
rootProject.ext.set('jdCoreVersion', findProperty('jdCoreVersion') ?: '1.1.4')
// jd-core from Maven local (org.jd:jd-core) by default; '-PjdCoreJitpack' uses JitPack (com.github.asprenas:jd-core)
rootProject.ext.set('jdCoreJitpack', project.hasProperty('jdCoreJitpack'))

allprojects {
    apply plugin: 'eclipse'
    apply plugin: 'idea'

    plugins.withType(JavaPlugin) {
        java {
            toolchain {
                // Build with the JDK running Gradle (JDK 21 or JDK 25); bytecode targets Java 21
                languageVersion = JavaLanguageVersion.current()
            }
        }
        tasks.withType(JavaCompile).configureEach {
            options.release = 21
            options.compilerArgs << '-Xlint:deprecation'
            options.compilerArgs << '-Xlint:unchecked'
            options.encoding = 'UTF-8'
        }
    }

    repositories {
        mavenLocal {
            content { includeGroup 'org.jd' }  // jd-core only
        }
        mavenCentral()
        maven { url = 'https://jitpack.io' }   // jd-core (-PjdCoreJitpack)
    }
}

// 'cleanIdea' task extension //
tasks.named('cleanIdea') {
    doFirst {
        delete project.name + '.iws'
        delete 'out'
    }
}

// All in one JAR file //
subprojects.each { subproject ->
    evaluationDependsOn(subproject.path)
}

jar {
    dependsOn subprojects.collect { it.tasks.named('jar') }

    // Add SPI directory
    def tmpSpiDir = file('build/tmp/spi')
    from tmpSpiDir
    // Add dependencies
    subprojects.each { subproject ->
        from subproject.sourceSets.main.output.classesDirs
        from subproject.sourceSets.main.output.resourcesDir
        // External (non project) runtime dependencies; compileOnly ones are excluded
        def externalDeps = subproject.configurations.runtimeClasspath.incoming.artifactView {
            componentFilter { it instanceof ModuleComponentIdentifier }
        }.files
        from { externalDeps.collect { it.isDirectory() ? it : zipTree(it) } }
    }

    manifest {
        attributes 'Main-Class': 'org.jd.gui.App',
                'SplashScreen-Image': 'org/jd/gui/images/jd_icon_128.png',
                'JD-GUI-Version': project.version,
                'JD-Core-Version': project.jdCoreVersion
    }
    exclude 'META-INF/licenses/**', 'META-INF/maven/**', 'META-INF/INDEX.LIST'
    exclude '**/ErrorStrip_*.properties', '**/RSyntaxTextArea_*.properties', '**/RTextArea_*.properties'
    exclude '**/FocusableTip_*.properties', '**/RSyntaxTextArea_License.txt'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    doFirst {
        // Create SPI directory
        tmpSpiDir.deleteDir()
        def tmpSpiServicesDir = file(tmpSpiDir.path + '/META-INF/services')
        tmpSpiServicesDir.mkdirs()
        // Copy and merge SPI config files
        subprojects.each { subproject ->
            def servicesDir = file(subproject.sourceSets.main.output.resourcesDir.path + '/META-INF/services')
            if (servicesDir.exists()) {
                servicesDir.eachFile { serviceFile ->
                    def target = file(tmpSpiServicesDir.path + '/' + serviceFile.name)
                    target << serviceFile.text
                }
            }
        }
    }
}

// Minify JAR file //
def minJar = file('build/libs/' + project.name + '-' + project.version + '-min.jar')

def javaHome = javaToolchains.launcherFor(java.toolchain).get().metadata.installationPath.asFile
def jmodsDir = new File(javaHome, 'jmods')
def jdkClassesDir = file('build/tmp/jdk-classes')

// JDK 24+ builds may ship without 'jmods' (JEP 493, e.g. Temurin 25): extract JDK classes from 'lib/modules'
tasks.register('extractJdkClasses', Exec) {
    onlyIf { !jmodsDir.isDirectory() }
    inputs.file new File(javaHome, 'lib/modules')
    outputs.dir jdkClassesDir
    doFirst { delete jdkClassesDir }
    commandLine new File(javaHome, 'bin/jimage').path, 'extract', '--dir', jdkClassesDir.path,
            '--include', 'regex:/java\\..*', new File(javaHome, 'lib/modules').path
}

tasks.register('proguard', proguard.gradle.ProGuardTask) {
    dependsOn 'jar', 'extractJdkClasses'
    configuration 'src/proguard/resources/proguard.config.txt'
    injars jar.archiveFile.get().asFile
    outjars minJar
    if (jmodsDir.isDirectory()) {
        libraryjars([jarfilter: '!**.jar', filter: '!module-info.class'], jmodsDir)
    } else {
        doFirst {
            jdkClassesDir.eachDir { moduleDir -> libraryjars([filter: '!module-info.class'], moduleDir) }
        }
    }
}

// Java executable wrapper for Windows //
launch4j {
    version = project.version
    textVersion = project.version
    fileDescription = 'JD-GUI'
    productName = 'JD-GUI'
    errTitle = 'JD-GUI Windows Wrapper'
    copyright = 'JD-GUI (C) 2008-2019 Emmanuel Dupuy'
    icon = projectDir.path + '/src/launch4j/resources/images/jd-gui.ico'
    jarFiles = files(minJar)
    dontWrapJar = false
    requiresJdk = false
    jreMinVersion = '21'
    bundledJrePath = '%JAVA_HOME%'
}
tasks.named('createExe') { dependsOn 'proguard' }

// Packages for Linux //
ospackage {
    license = file('LICENSE')
    maintainer = 'Emmanuel Dupuy <emmanue1@users.noreply.github.com>'
    os = LINUX
    packageDescription = 'JD-GUI, a standalone graphical utility that displays Java sources from CLASS files'
    packageGroup = 'java'
    packageName = project.name
    release = '0'
    summary = 'A Java Decompiler'
    url = 'https://github.com/java-decompiler/jd-gui'

    into '/opt/' + project.name
    from (minJar) {
        filePermissions { unix(0755) }
    }
    from ('src/linux/resources/') {
        filePermissions { unix(0755) }
    }
    from 'LICENSE', 'NOTICE', 'README.md'

    postInstall 'cd /opt/' + project.name + '; ln -s ./' + minJar.name + ' ./jd-gui.jar; xdg-icon-resource install --size 128 --novendor ./jd_icon_128.png jd-gui; xdg-desktop-menu install ./*.desktop'
    preUninstall 'cd /opt/' + project.name + '; rm -f ./jd-gui.jar; rm -fr ./ext; xdg-desktop-menu uninstall ./*.desktop'
}

// Distributions for OSX and Windows //
distributions {
    osx {
        contents {
        into('JD-GUI.app/Contents') {
            from('src/osx/resources') {
                include 'Info.plist'
                expand VERSION: project.version,
                       JAR: minJar.name
            }
        }
        into('JD-GUI.app/Contents/MacOS') {
            from('src/osx/resources') {
                include 'universalJavaApplicationStub.sh'
                filePermissions { unix(0755) }
            }
        }
        into('JD-GUI.app/Contents/Resources/Java') {
            from minJar
        }
        from 'LICENSE', 'NOTICE', 'README.md'
        }
    }
    windows {
        contents {
            from 'build/launch4j/jd-gui.exe'
            from 'LICENSE', 'NOTICE', 'README.md'
        }
    }
}

['installWindowsDist', 'windowsDistTar', 'windowsDistZip'].each { tasks.named(it) { dependsOn 'createExe' } }
['installOsxDist', 'osxDistTar', 'osxDistZip', 'buildDeb', 'buildRpm'].each { tasks.named(it) { dependsOn 'proguard' } }

tasks.named('build') { finalizedBy 'buildDeb', 'buildRpm' }
