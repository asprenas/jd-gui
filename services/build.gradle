apply plugin: 'java-library'

dependencies {
    api 'com.fifesoft:rsyntaxtextarea:3.0.4'
    implementation 'org.ow2.asm:asm:9.8'
    implementation parent.jdCoreJitpack
        ? 'com.github.asprenas:jd-core:v' + parent.jdCoreVersion
        : 'org.jd:jd-core:' + parent.jdCoreVersion
    api project(':api')
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

version = parent.version

// ANTLR //
ext.antlr4 = [
        antlrSource: 'src/main/antlr',
        destinationDir: 'src-generated/antlr/java',
        grammarPackage: 'org.jd.gui.util.parser.antlr'
]

configurations {
    antlr4 {
        description = "ANTLR4"
    }
}

dependencies {
    implementation 'org.antlr:antlr4-runtime:4.5'
    antlr4 'org.antlr:antlr4:4.5'
}

tasks.register('antlr4GenerateGrammarSource', JavaExec) {
    description = 'Generates Java sources from ANTLR4 grammars.'

    inputs.dir file(antlr4.antlrSource)
    outputs.dir file(antlr4.destinationDir)

    def grammars = fileTree(antlr4.antlrSource).include('**/*.g4')
    def pkg = antlr4.grammarPackage.replaceAll("\\.", "/")

    doFirst { mkdir antlr4.destinationDir }
    mainClass = 'org.antlr.v4.Tool'
    classpath = configurations.antlr4
    args = ['-o', "${antlr4.destinationDir}/${pkg}", '-package', antlr4.grammarPackage, grammars.files].flatten()
}

sourceSets.main.java.srcDir(tasks.named('antlr4GenerateGrammarSource').map { file(antlr4.destinationDir) })

test {
    useJUnitPlatform()
    // '-PupdateSnapshots' rewrites the parser snapshot files in src/test/resources/parser/expected
    systemProperty 'snapshot.update', project.hasProperty('updateSnapshots')
}

clean {
    delete 'src-generated'
}

idea.module {
    generatedSourceDirs += file(antlr4.destinationDir)
}

eclipse.classpath.file.withXml { xml ->
    def node = xml.asNode()
    node.appendNode( 'classpathentry', [ kind: 'src', path: antlr4.destinationDir])
}
eclipseClasspath.dependsOn 'antlr4GenerateGrammarSource'
